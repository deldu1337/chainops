apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chainops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/deldu1337/chainops.git
    targetRevision: main
    path: k8s
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: chainops
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
