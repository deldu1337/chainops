apiVersion: v1
kind: ConfigMap
metadata:
  name: prom-config
  namespace: chainops
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: chainops-rpc
        static_configs:
          - targets: ['rpc-exporter.chainops.svc.cluster.local:9108']
      - job_name: geth-native
        metrics_path: /debug/metrics/prometheus
        static_configs:
          - targets: ['geth.chainops.svc.cluster.local:6060']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: chainops
spec:
  replicas: 1
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args: [--config.file=/etc/prometheus/prometheus.yml,--storage.tsdb.path=/prometheus,--storage.tsdb.retention.time=2d]
          ports:
            - {containerPort: 9090}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 1Gi}
      volumes:
        - name: config
          configMap: {name: prom-config}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: chainops
spec:
  selector: {app: prometheus}
  ports: [{port: 9090, targetPort: 9090}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: chainops
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.chainops.svc.cluster.local:9090
        isDefault: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: chainops
spec:
  replicas: 1
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.1.0
          env:
            - {name: GF_SECURITY_ADMIN_USER, value: admin}
            - {name: GF_SECURITY_ADMIN_PASSWORD, value: chainops-local-only}
          ports: [{containerPort: 3000}]
          volumeMounts:
            - {name: datasource, mountPath: /etc/grafana/provisioning/datasources}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes:
        - name: datasource
          configMap: {name: grafana-datasource}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: chainops
spec:
  selector: {app: grafana}
  ports: [{port: 3000, targetPort: 3000}]
